version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Etc/UTC"
    rebase-strategy: auto
    versioning-strategy: increase
    cooldown:
      default-days: 3
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    ignore:
      # xo >=0.58 exports an all-in-one factory incompatible with this package's composition
      - dependency-name: "eslint-config-xo"
        versions: [">=0.51.0"]
      # typescript-eslint rejects the TS 7.0 API; revisit once >=7.1 is supported
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
